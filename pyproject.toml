[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cycle-orchestrator"
version = "0.2.0"
description = "PRD-approved, private Spec Kit → Codex → Claude review pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-cycle = "ai_cycle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_cycle*"]

[tool.setuptools.package-data]
ai_cycle = ["web/*.html"]
